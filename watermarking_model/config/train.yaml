dataset: "librispeech"

adv: True

path:
#  raw_path: "/home/yizhu/Data/LibriSpeech_wav"
#  raw_path: "/dataset/LibriSpeech_wav"
  raw_path: "/dataset/merge_libri_voxcel"
#  raw_path: "/home/yizhu/Data/LJSpeech-1.1"
  raw_path_test: "experiments/cloned_speechs"
  wm_speech: "./results/wm_speech"
  ckpt: "results/ckpt/"
  log_path: "results/log/"

watermark:
  length: 10
  delay_amt_second: 0.5
  future_amt_second: 0.5

optimize:
  lr: 0.0001
  lambda_e: 1.
  lambda_m: 10.
  # lambda_m: 0.01
  lambda_no_m: 0.01
  lambda_a: 0.01
  lambda_b: 1.
  lambda_c: 1.
  batch_size: 8  # remote batch_size=8, local batch_size=2
  step_size: 5000 # large value means do not decay
  gamma: 0.98
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  up_step: 4000
  anneal_steps: [300000, 400000, 500000]
  anneal_rate: 0.3
  lr_disc: 0.00002
  alpha: 10
  train_size: 31000
  smooth_chunks: null
  dilate_chunks: null
  target_smooth_ms: 40
  target_dilate_ms: 15
  floor_eps: 0.2
  tau: 0.15

iter:
  epoch: 60
  save_circle: 5
  show_circle: 1000
  val_circle: 1000
  data_divider: 1
  test_record_num: 100
  num_save_img: 10

select_aug_mode:
  "use_eval" # other are 'all' and 'use_eval_acc', used to sample augmentations, `fixed` uses the prob from aug_weights, `all` uses all agmentations every step
  # `use_eval_acc` changes the weights based on the accuracies at evaluation time

aug_weights:
  identity: 1.0 # no augmentation
